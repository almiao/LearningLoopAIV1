<svg width="680" viewBox="0 0 680 650" role="img" xmlns="http://www.w3.org/2000/svg">
<title>学习闭环业务流程</title>
<desc>三个入口汇入同一个 LLM 操练引擎(出题、锚点判分、答崩才补讲),结果写进确定性的失败账本;复习项在生疏与扎实之间流转,调度器按下次到期拉成今日队列,次日回到今日复习,形成闭环。</desc>
<style>
  .t{font:14px -apple-system,system-ui,sans-serif;fill:#2a2724}
  .ts{font:12px -apple-system,system-ui,sans-serif;fill:#6c6960}
  .th{font:500 14px -apple-system,system-ui,sans-serif;fill:#2a2724}
  .box{fill:#f5f4f1;stroke:#d9d6cf;stroke-width:1}
  .teal{fill:#e3f0ec;stroke:#0e7264;stroke-width:1}
  .amber{fill:#f9ecd5;stroke:#caa24e;stroke-width:1}
  .arr{stroke:#9a978e;stroke-width:1.5;fill:none;marker-end:url(#ah)}
  @media (prefers-color-scheme: dark){
    .t,.th{fill:#e7e4de}.ts{fill:#a8a59d}
    .box{fill:#26241f;stroke:#403d36}
    .teal{fill:#11342e;stroke:#3a8d7e}
    .amber{fill:#33291a;stroke:#9a7b36}
    .arr{stroke:#7a776f}
  }
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#9a978e" stroke-width="1.3"/></marker></defs>

<rect class="box" x="44" y="34" width="186" height="48" rx="8"/><text class="th" x="137" y="56" text-anchor="middle">今日复习</text><text class="ts" x="137" y="73" text-anchor="middle">账本到期项</text>
<rect class="box" x="247" y="34" width="186" height="48" rx="8"/><text class="th" x="340" y="56" text-anchor="middle">学新东西</text><text class="ts" x="340" y="73" text-anchor="middle">带一篇原文 · 读后练</text>
<rect class="box" x="450" y="34" width="186" height="48" rx="8"/><text class="th" x="543" y="56" text-anchor="middle">面试战役</text><text class="ts" x="543" y="73" text-anchor="middle">JD 话题 + 倒计时</text>

<line class="arr" x1="137" y1="82" x2="330" y2="110"/>
<line class="arr" x1="340" y1="82" x2="340" y2="110"/>
<line class="arr" x1="543" y1="82" x2="350" y2="110"/>

<rect class="teal" x="240" y="112" width="200" height="46" rx="8"/><text class="th" x="340" y="133" text-anchor="middle">出题</text><text class="ts" x="340" y="150" text-anchor="middle">针对漏的锚点出变体</text>
<line class="arr" x1="340" y1="158" x2="340" y2="190"/>
<rect class="box" x="240" y="190" width="200" height="46" rx="8"/><text class="th" x="340" y="211" text-anchor="middle">你作答</text><text class="ts" x="340" y="228" text-anchor="middle">一次性提交,不可改</text>
<line class="arr" x1="340" y1="236" x2="340" y2="268"/>
<rect class="teal" x="240" y="268" width="200" height="46" rx="8"/><text class="th" x="340" y="289" text-anchor="middle">锚点判分</text><text class="ts" x="340" y="306" text-anchor="middle">命中 / 漏 哪几个锚点</text>

<line class="arr" x1="300" y1="314" x2="165" y2="340"/>
<line class="arr" x1="380" y1="314" x2="515" y2="340"/>
<text class="ts" x="232" y="330" text-anchor="middle">过线</text>
<text class="ts" x="452" y="330" text-anchor="middle">答崩</text>

<rect class="box" x="60" y="340" width="180" height="52" rx="8"/><text class="th" x="150" y="364" text-anchor="middle">转扎实</text><text class="ts" x="150" y="381" text-anchor="middle">会了就放走,不补讲</text>
<rect class="teal" x="440" y="340" width="180" height="52" rx="8"/><text class="th" x="530" y="364" text-anchor="middle">补讲</text><text class="ts" x="530" y="381" text-anchor="middle">针对漏点靶向讲解</text>

<line class="arr" x1="150" y1="392" x2="285" y2="420"/>
<line class="arr" x1="530" y1="392" x2="395" y2="420"/>

<rect class="amber" x="170" y="420" width="340" height="50" rx="8"/><text class="th" x="340" y="442" text-anchor="middle">失败账本</text><text class="ts" x="340" y="459" text-anchor="middle">你答崩的点 · 扁平一列 · 唯一持久记忆</text>
<line class="arr" x1="340" y1="470" x2="200" y2="488"/>

<rect class="box" x="128" y="488" width="96" height="40" rx="8"/><text class="th" x="176" y="513" text-anchor="middle">新建</text>
<rect class="amber" x="292" y="488" width="96" height="40" rx="8"/><text class="th" x="340" y="513" text-anchor="middle">生疏</text>
<rect class="amber" x="456" y="488" width="96" height="40" rx="8"/><text class="th" x="504" y="513" text-anchor="middle">扎实</text>
<line class="arr" x1="224" y1="506" x2="292" y2="506"/>
<text class="ts" x="258" y="500" text-anchor="middle">答崩才生</text>
<line class="arr" x1="388" y1="500" x2="456" y2="500"/>
<text class="ts" x="422" y="494" text-anchor="middle">过线</text>
<line class="arr" x1="456" y1="518" x2="388" y2="518"/>
<text class="ts" x="422" y="530" text-anchor="middle">又崩</text>

<line class="arr" x1="340" y1="528" x2="340" y2="558"/>
<rect class="amber" x="230" y="558" width="220" height="44" rx="8"/><text class="th" x="340" y="578" text-anchor="middle">调度器</text><text class="ts" x="340" y="594" text-anchor="middle">按下次到期拉队列</text>

<polyline class="arr" points="230,580 30,580 30,58 44,58" fill="none"/>
<text class="ts" x="92" y="573" text-anchor="middle">次日再现</text>

<rect class="teal" x="44" y="616" width="14" height="14" rx="3"/><text class="ts" x="66" y="627">LLM 当场生成 · 用完即弃</text>
<rect class="amber" x="300" y="616" width="14" height="14" rx="3"/><text class="ts" x="322" y="627">确定性持久记忆 · 失败账本</text>
</svg>
